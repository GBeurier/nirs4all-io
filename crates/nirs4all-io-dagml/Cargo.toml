[package]
name = "nirs4all-io-dagml"
description = "Ecosystem-only bridge: a nirs4all-io AssembledDataset -> a dag-ml-data CoordinatorDataPlanEnvelope (EPIC 10, ADR-0001). Excluded from the main workspace because it path-depends on the dag-ml-data sibling; building it requires the ecosystem tree."
version = "0.1.0-alpha.0"
edition = "2021"
license = "CeCILL-2.1 OR AGPL-3.0-or-later"
authors = ["Gregory Beurier <beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-io"
publish = false

[[bin]]
name = "emit-dagml"
path = "src/bin/emit_dagml.rs"

[dependencies]
nirs4all-io = { path = "../nirs4all-io" }
dag-ml-data = { path = "../../../dag-ml-data/crates/dag-ml-data" }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
