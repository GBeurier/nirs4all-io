[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "nirs4all-io"
description = "Dataset-assembly bridge for the nirs4all ecosystem (Rust core, pyo3 binding)."
requires-python = ">=3.11"
license = { text = "CeCILL-2.1 OR AGPL-3.0-or-later" }
dynamic = ["version"]

[tool.maturin]
# Build the abi3 extension module `nirs4all_io` from the Cargo crate in this dir.
module-name = "nirs4all_io"
