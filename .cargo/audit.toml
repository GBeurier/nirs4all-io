#
# Accepted RustSec advisories for `scripts/audit_rust_locks.sh`, which runs
# `cargo audit --deny warnings` from the repository root on every lockfile.
# Everything not listed here stays denied. Each entry states why no update
# resolves it and when it must be removed; `docs/dev/release_process.md`
# ("Accepted RustSec advisories") holds the same record.

[advisories]
ignore = [
    # RUSTSEC-2026-0543 "chrono is unmaintained" (informational, assigned
    # 2026-11-17, `patched = []`: no fixed chrono release exists, 0.4.45 is the
    # latest). It reports maintenance status, not a vulnerability. chrono is a
    # mandatory dependency of arrow-array and parquet up to their latest
    # release (60.1.0, the Parquet reader), and of calamine 0.38.0 `dates`
    # through `nirs4all-formats` (locked at 0.2.17; unchanged in Formats
    # 0.2.19). IO has no direct chrono dependency to replace.
    # Remove when Arrow/Parquet and the pinned Formats release resolve without
    # chrono, or when the advisory is withdrawn. A chrono vulnerability gets
    # its own advisory identifier and is still denied.
    "RUSTSEC-2026-0543",
]
