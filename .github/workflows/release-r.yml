# SPDX-License-Identifier: CeCILL-2.1 OR AGPL-3.0-or-later
# Build, install, smoke-test, and (on a release tag) attach the nirs4allio R
# package source tarball.
#
# IMPORTANT — this is the methods-style / R-universe path, NOT the formats
# vendored path. io's R binding is a C SHIM over the PREBUILT nirs4all-io-capi
# cdylib: bindings/r/src/n4io.c links `-lnirs4all_io_capi` via N4IO_INCLUDE /
# N4IO_CAPI_DIR (see bindings/r/src/Makevars). There is no extendr, no src/rust/,
# no relative crate path deps — so the formats vendor / ./configure / .prepare /
# vendor.tar.xz machinery DOES NOT APPLY here.
#
# Because the package links a separately-built cdylib, the
# `nirs4allio_<version>.tar.gz` produced here is an R-UNIVERSE / GitHub-RELEASE
# ASSET, NOT a CRAN-self-contained tarball: it cannot build on CRAN's farm
# without the prebuilt libnirs4all_io_capi on the system. A CRAN-submittable io
# R package requires REWORKING the binding to vendor + compile the Rust core at
# install time (extendr-static or a bundled cdylib build) — tracked as a
# follow-up. See docs/dev/release_process.md.
#
# Triggers
# --------
# - workflow_dispatch        -> on-demand install + smoke + tarball build.
# - push tag v[0-9]*.[0-9]*.[0-9]* -> install+smoke matrix -> build tarball ->
#   attach nirs4allio_<version>.tar.gz to the matching Release (gated on a
#   non-pre-release tag).

name: release-r

on:
  workflow_dispatch: {}
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # Build the cdylib, install the R package against it, and run the smoke test
  # across the same OS/R matrix CRAN-class consumers use.
  # =========================================================================
  install-smoke:
    name: install + smoke / ${{ matrix.cfg.label }}
    runs-on: ${{ matrix.cfg.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - label: linux-release
            runs_on: ubuntu-22.04
            r_version: "release"
          - label: linux-devel
            runs_on: ubuntu-22.04
            r_version: "devel"
          - label: macos-arm64-release
            runs_on: macos-14
            r_version: "release"
          - label: windows-release
            runs_on: windows-2022
            r_version: "release"
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.cfg.r_version }}
          use-public-rspm: true

      # bindings/r/build_and_test.sh: builds nirs4all-io-capi (release),
      # exports N4IO_INCLUDE / N4IO_CAPI_DIR / N4IO_CORPUS, R CMD INSTALLs the
      # package against the prebuilt cdylib, and runs the smoke. Rtools provides
      # bash on Windows; the build dir is on PATH there so the DLL resolves at
      # runtime (Windows has no rpath, which the Makevars -Wl,-rpath sets on
      # ELF/Mach-O hosts).
      - name: Build cdylib, install R package, run smoke
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/target/release:$PATH"   # Windows DLL resolution at smoke time
          bash bindings/r/build_and_test.sh

  # =========================================================================
  # Build the source tarball (R-universe / Release asset).
  # =========================================================================
  build-tarball:
    name: Build R source tarball
    needs: install-smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: R CMD build (produces nirs4allio_<version>.tar.gz)
        run: |
          set -euo pipefail
          R CMD build bindings/r
          mkdir -p dist-r
          mv nirs4allio_*.tar.gz dist-r/
          ls -la dist-r/

      - uses: actions/upload-artifact@v4
        with:
          name: nirs4allio-r-tarball
          path: dist-r/nirs4allio_*.tar.gz
          if-no-files-found: error
          retention-days: 90

  # =========================================================================
  # Attach the tarball to the GitHub Release on non-pre-release tags.
  # NOTE: this tarball is R-universe / Release-asset ONLY — it is NOT
  # CRAN-self-contained (it needs the prebuilt libnirs4all_io_capi).
  # =========================================================================
  publish-release-asset:
    name: Attach R tarball to GitHub Release
    needs: build-tarball
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nirs4allio-r-tarball
          path: dist-r/

      - name: Upload to the matching Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-r/*.tar.gz
          fail_on_unmatched_files: true
