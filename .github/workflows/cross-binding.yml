# EPIC 12.4 — cross-binding behavioral parity: every locally-available binding
# harnessed by tests/cross_binding/verify.sh must normalize the same spec into
# byte-identical canonical DatasetSpec JSON.
name: Cross-binding parity
on:
  push:
    branches: [main, 'rc/**']
  pull_request:
    branches: [main, 'rc/**']
  workflow_dispatch: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: r-lib/actions/setup-r@v2
      - name: Cross-binding parity (available bindings)
        run: bash tests/cross_binding/verify.sh
