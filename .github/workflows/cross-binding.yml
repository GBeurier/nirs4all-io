# EPIC 12.4 — cross-binding behavioral parity: the CLI, WASM, and R bindings must
# normalize the same spec into byte-identical canonical DatasetSpec JSON.
name: Cross-binding parity
on:
  push:
    branches: [main, 'rc/**']
  pull_request:
    branches: [main, 'rc/**']
  workflow_dispatch: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: r-lib/actions/setup-r@v2
      - name: Cross-binding parity (CLI ≡ WASM ≡ R)
        run: bash tests/cross_binding/verify.sh
