name: Python binding
on:
  push:
    branches: [main, 'rc/**']
  pull_request:
    branches: [main, 'rc/**']
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Build the abi3 wheel
        run: |
          pip install maturin pytest
          maturin build -m bindings/python/Cargo.toml --interpreter python3 --out dist
      - name: "Install + test (clean runner: only the binding is importable)"
        run: |
          # The optional nirs4all integration is exercised downstream; this
          # clean gate validates the self-contained wheel and its adapter seam.
          pip install pytest pyarrow dist/*.whl
          python -m pytest bindings/python/tests -q
