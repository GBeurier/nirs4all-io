# SPDX-License-Identifier: CeCILL-2.1 OR AGPL-3.0-or-later
# EPIC 12.6 — release pipelines. On a version tag, build the distributable
# artifacts for the Python + C-ABI surfaces and attach them to the GitHub
# Release:
#   - Python abi3 wheels (maturin, all 3 OS)  → PyPI (Trusted Publishing / OIDC)
#   - Python sdist (maturin)                  → PyPI
#   - C-ABI archive (lib + header + LICENSES) → release asset (for C/R/MATLAB hosts)
#
# The other surfaces live in their own workflows:
#   - JS/WASM npm package  → .github/workflows/release-npm.yml (@nirs4all/io-wasm)
#   - R source tarball     → .github/workflows/release-r.yml   (R-universe / Release asset)
#   - MATLAB/Octave zip    → .github/workflows/release-matlab.yml
#   - Rust crates          → .github/workflows/release-crates.yml (crates.io)
#   - Source + SBOM bundle → .github/workflows/release-source.yml
#
# Publish steps gate on a non-pre-release tag (no '-' in the tag) and on a real
# tag push (never workflow_dispatch). io's Rust build is PURE RUST (no system
# HDF5/C lib), so macOS binary wheels ship alongside Linux + Windows — there is
# NO macOS deferral here.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without publishing"
        required: false
        default: "true"
      repair_031:
        description: "Repair v0.3.1 Windows wheel using the original release run"
        type: boolean
        default: false
      expected_source_sha:
        description: "Reviewed repair source commit SHA"
        type: string
        required: false

permissions:
  contents: write   # attach release assets
  id-token: write   # PyPI trusted publishing (OIDC)
  actions: read     # retrieve reviewed artifacts from the original run

jobs:
  release-validation:
    if: ${{ !inputs.repair_031 }}
    uses: ./.github/workflows/release-validation.yml

  rust-security:
    name: Rust security (all lockfiles)
    if: ${{ !inputs.repair_031 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Require all binding versions to match the release version
        run: scripts/bump_version.sh --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Audit root and binding dependency graphs
        run: bash scripts/audit_rust_locks.sh

  python-wheels:
    name: Python wheels (${{ matrix.os }})
    needs: rust-security
    if: ${{ !cancelled() && (needs.rust-security.result == 'success' || (inputs.repair_031 && needs.rust-security.result == 'skipped')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # io's Rust core is pure-Rust (glob/flate2/zip/csv/regex/serde/sha2),
        # so macOS wheels build cleanly — ship all three OSes.
        os: ${{ fromJSON(inputs.repair_031 && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Bind Windows repair to the immutable release source
        if: ${{ inputs.repair_031 }}
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${EXPECTED_SOURCE_SHA}"
          tag_sha=$(git rev-parse 'refs/tags/v0.3.1^{commit}')
          test "$tag_sha" = 28e47c9d6491b83a31dd36a25f2b0a35eeab9860
          git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA"
          git diff --quiet "$tag_sha" "$GITHUB_SHA" -- . \
            ':(exclude).gitattributes' \
            ':(exclude)bindings/python/tests/test_import_boundary.py' \
            ':(exclude).github/workflows/cross-binding.yml' \
            ':(exclude).github/workflows/release.yml'
          original=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/42564486877" --jq '[.head_sha,.event,.head_branch,.status] | join(" ")')
          test "$original" = "$tag_sha push v0.3.1 completed"
      - name: Verify release tag identity
        run: python scripts/verify_release_tag.py
      - name: Configure reproducible Rust paths
        run: python scripts/configure_release_env.py
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --locked --release -m bindings/python/Cargo.toml --out dist
      - name: Canonicalize embedded Rust SBOM and wheel container
        shell: bash
        run: python scripts/normalize_wheel.py dist/*.whl
      - name: Install and test wheel before publishing
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Keep the release wheel independently installable. Adapter behavior
          # uses an injected test double; nirs4all integration runs downstream.
          N4IO_TEST_WHEEL=$(python -c 'from pathlib import Path; wheels = list(Path("dist").glob("nirs4all_io-*.whl")); assert len(wheels) == 1, wheels; print(wheels[0].resolve().as_posix())')
          export N4IO_TEST_WHEEL
          python -m pip install pytest pyarrow "$N4IO_TEST_WHEEL"
          python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python sdist
    if: ${{ !inputs.repair_031 }}
    needs: rust-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Verify release tag identity
        run: python scripts/verify_release_tag.py
      - name: Configure reproducible Rust paths
        run: python scripts/configure_release_env.py
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  c-abi-archive:
    name: C-ABI archive (${{ matrix.target }})
    if: ${{ !inputs.repair_031 }}
    needs: rust-security
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Verify release tag identity
        run: python scripts/verify_release_tag.py
      - name: Configure reproducible Rust paths
        run: python scripts/configure_release_env.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Assemble archive
        shell: bash
        run: |
          python scripts/build_capi_archive.py \
            "${{ matrix.target }}" .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: c-abi-${{ matrix.target }}
          path: nirs4all-io-capi-*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [release-validation, python-wheels, python-sdist, c-abi-archive]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
    # Gate to production tags only. Pre-release tags (anything containing '-',
    # e.g. v0.1.0-alpha.1) are excluded so they never reach PyPI; and never on
    # a workflow_dispatch dry run — only a real tag push publishes. Mirrors the
    # nirs4all-formats / nirs4all-methods convention.
    if: ${{ !cancelled() && needs.python-wheels.result == 'success' && ((inputs.repair_031 && needs.release-validation.result == 'skipped' && needs.python-sdist.result == 'skipped' && needs.c-abi-archive.result == 'skipped') || (!inputs.repair_031 && needs.release-validation.result == 'success' && needs.python-sdist.result == 'success' && needs.c-abi-archive.result == 'success')) && ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')) }}
    # Use the `pypi` GitHub environment so the OIDC token carries an
    # `environment: pypi` claim — matching the Trusted Publisher configured on
    # pypi.org with Environment = `pypi`. This is the SAME convention as
    # nirs4all-formats / nirs4all-methods, so every publisher across the
    # ecosystem is created identically: owner=GBeurier, repo=<this repo>,
    # workflow=release.yml, Environment=`pypi`.
    environment:
      name: pypi
      url: https://pypi.org/p/nirs4all-io
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve immutable release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE '/^\[workspace.package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p}' Cargo.toml)
          release_tag="v${version}"
          if [ "${{ github.event_name }}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "${release_tag}"
          else
            git rev-parse --verify "refs/tags/${release_tag}^{commit}" >/dev/null
            if [ "${{ inputs.repair_031 }}" = "true" ]; then
              git diff --quiet "${release_tag}" -- . \
                ':(exclude).github/workflows/release.yml' \
                ':(exclude).github/workflows/cross-binding.yml' \
                ':(exclude).gitattributes' \
                ':(exclude)bindings/python/tests/test_import_boundary.py'
            else
              git diff --quiet "${release_tag}" -- . \
                ':(exclude).github/workflows/release.yml' \
                ':(exclude).github/workflows/release-npm.yml' \
                ':(exclude)scripts/build_capi_archive.py' \
                ':(exclude)scripts/normalize_wheel.py'
            fi
            echo "Manual repair matches ${release_tag} outside release infrastructure."
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Pull ONLY the Python wheels + sdist into dist/. A bare download-artifact
      # with no `pattern:`/`name:` grabs EVERY run artifact, which would drag the
      # C-ABI archives (nirs4all-io-capi-*.tar.gz) into dist/; the publish
      # action's twine pre-flight then rejects them ("InvalidDistribution: No
      # PKG-INFO in archive") and aborts before any upload. Wheels live under
      # wheels-*, the sdist under the `sdist` artifact.
      - name: Download Python wheels
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Download original Linux and macOS wheels for repair
        if: ${{ inputs.repair_031 }}
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          artifact-ids: 13650672538,13651072310
          merge-multiple: true
          run-id: 42564486877
          github-token: ${{ github.token }}
      - name: Download Python sdist
        if: ${{ !inputs.repair_031 }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: sdist
          path: dist
      - name: Download original sdist for repair
        if: ${{ inputs.repair_031 }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: sdist
          path: dist
          run-id: 42564486877
          github-token: ${{ github.token }}
      - name: Validate tag matches the built wheel/sdist version
        run: |
          set -euo pipefail
          # The tag minus the leading 'v' must equal the PEP 440 package version
          # baked into the wheels + sdist. PEP 440 alpha/beta/rc spellings
          # (0.1.0a1, 0.1.0b2, 0.1.0rc1) are allowed alongside a plain X.Y.Z;
          # SemVer pre-release tags (with '-') are already gated out above.
          # scripts/bump_version.sh keeps the package version in sync with the
          # Cargo workspace SoT.
          tag_version="${{ steps.identity.outputs.version }}"
          # maturin normalizes to nirs4all_io-<version>-... for wheels and
          # nirs4all_io-<version>.tar.gz for the sdist.
          dist_file=$(ls dist/nirs4all_io-*.whl dist/nirs4all_io-*.tar.gz 2>/dev/null | head -n1 || true)
          if [[ -z "${dist_file}" ]]; then
            echo "::error::no nirs4all_io wheel/sdist found in dist/ to validate" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          base=$(basename "${dist_file}")
          rest="${base#nirs4all_io-}"
          dist_version="${rest%%-*}"               # wheel:  0.1.0a1-cp311-... -> 0.1.0a1
          dist_version="${dist_version%.tar.gz}"   # sdist:  0.1.0a1.tar.gz    -> 0.1.0a1
          # Auto-publish to the real PyPI index is PRODUCTION-ONLY: the tag must
          # be a plain vX.Y.Z. This is stricter than the job-level !contains('-')
          # gate (which lets a PEP 440 prerelease spelling like v0.1.0a1 slip
          # through, since it has no '-'); pre-releases are published manually.
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a production release version (vX.Y.Z); pre-releases are not auto-published to PyPI" >&2
            exit 1
          fi
          if [[ "${tag_version}" != "${dist_version}" ]]; then
            echo "::error::Tag version (${tag_version}) != built package version (${dist_version})" >&2
            exit 1
          fi
          echo "${{ steps.identity.outputs.release_tag }} matches built package version ${dist_version}."
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Idempotent publish: a re-run on an already-published tag (or a tag
          # whose version was partially uploaded) must not hard-fail with
          # "400 File already exists". skip-existing makes twine treat an
          # already-present file as success and upload only what is missing.
          skip-existing: true

  github-release:
    name: Attach assets to the GitHub release
    needs: [python-wheels, python-sdist, c-abi-archive, publish-pypi]
    runs-on: ubuntu-latest
    # Same gate as publish-pypi: production tags only, pre-release tags ('-')
    # excluded so a pre-release never cuts a public GitHub Release.
    if: ${{ !cancelled() && needs.python-wheels.result == 'success' && needs.publish-pypi.result == 'success' && ((inputs.repair_031 && needs.python-sdist.result == 'skipped' && needs.c-abi-archive.result == 'skipped') || (!inputs.repair_031 && needs.python-sdist.result == 'success' && needs.c-abi-archive.result == 'success')) && ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')) }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Download original release artifacts for repair
        if: ${{ inputs.repair_031 }}
        uses: actions/download-artifact@v8.0.1
        with:
          path: assets
          artifact-ids: 13650672538,13651072310,13650871502,13650584508,13650669240,13651360803
          merge-multiple: true
          run-id: 42564486877
          github-token: ${{ github.token }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-pypi.outputs.release_tag }}
          files: |
            assets/*.whl
            assets/*.tar.gz
