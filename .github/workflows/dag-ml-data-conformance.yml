# EPIC 10.4 / M4 — cross-CLI conformance for the dag-ml-data emit.
#
# Builds the workspace-excluded `nirs4all-io-dagml` emit crate and checks that an
# io-emitted CoordinatorDataPlanEnvelope is accepted by BOTH ecosystem CLIs
# (dag-ml-data-cli validate-envelope + dag-ml-cli validate-data-binding). Needs
# the sibling repos; the harness SKIPs (exit 0) if they are absent, so this job is
# green on the standalone repo and runs for real in the ecosystem tree (siblings
# present as submodules, or cloned below when reachable).
name: dag-ml-data conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  cross-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch sibling repos (best-effort)
        run: |
          # The harness skips cleanly if these are unavailable (e.g. private).
          git clone --depth 1 https://github.com/GBeurier/dag-ml-data.git ../dag-ml-data || true
          git clone --depth 1 https://github.com/GBeurier/dag-ml.git ../dag-ml || true
      - name: Cross-CLI conformance
        run: bash tests/dag_ml_data/verify_cross_cli.sh
